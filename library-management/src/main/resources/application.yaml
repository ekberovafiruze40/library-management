spring:
  application:
    name: library-management

  datasource:
      url: jdbc:postgresql://localhost:5432/library_db
      username: postgres
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

  jpa:
        show-sql: true
        hibernate:
          ddl-auto: update
          properties:
            hibernate:
              dialect: org.hibernate.dialect.PostgreSQLDialect
  jwt:
        secret: ${JWT_SECRET}
        expiration: 3600000
